<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO PRO MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070c10;color:#fff;font-family:Consolas,monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{padding:14px}
.header{background:#121b23;border:1px solid #1f2e3a;border-radius:20px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.menuBtn{font-size:22px;cursor:pointer;margin-right:10px}
.online{color:#00ff88;font-size:13px}
.sub{display:flex;justify-content:center;margin-top:10px}
.sub span{border:1px solid #00ff88;padding:6px 18px;border-radius:20px;font-size:12px;color:#aaffcc}
#sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#0f1a23;border-right:1px solid #00ff88;z-index:99;transition:0.3s;padding:20px;display:flex;flex-direction:column;gap:10px}
#sidebar.open{left:0}
#sidebar b{color:#00ff88;margin-bottom:15px}
#sidebar button{background:#121b23;border:1px solid #1f2e3a;color:#fff;padding:12px;border-radius:12px;text-align:left;cursor:pointer}
#sidebar button:hover{background:#00ff88;color:#000}
#overlay{display:none;position:fixed;inset:0;background:#0008;z-index:90}
#overlay.show{display:block}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.view{display:none;flex:1;flex-direction:column}
.view.active{display:flex}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.bubble{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble.user{align-self:flex-end;background:#00ff88;color:#000;border-bottom-right-radius:4px;font-weight:600}
.bubble.bot{align-self:flex-start;background:#111a22;border:1px solid #00ff8840;border-left:3px solid #00ff88;border-bottom-left-radius:4px;color:#eafff1}
.bubble.bot img{width:100%;margin-top:10px;border-radius:12px;border:1px solid #00ff88;display:block}
.bar{padding:10px;background:#070c10}
.inputwrap{background:#111a22;border:1px solid #1f3a2a;border-radius:30px;display:flex;align-items:center;padding:6px 8px 6px 16px;gap:8px}
.inputwrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;font-family:Consolas}
.send{background:#00ff88;border:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.center{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:20px;text-align:center}
.center button{background:#00ff88;color:#000;border:none;padding:14px 24px;border-radius:30px;font-weight:bold;cursor:pointer}
</style></head><body>
<div id="overlay" onclick="toggleMenu()"></div>
<div id="sidebar">
<b>NEXO MENU ✨</b>
<button onclick="goView('chat')">💬 Chat NEXO</button>
<button onclick="goView('video')">🎬 Criar Vídeo</button>
<button onclick="goView('imagem')">🖼️ Criar Imagem</button>
<button onclick="goView('sobre')">ℹ️ Sobre</button>
</div>
<div class="top">
<div class="header"><div><span class="menuBtn" onclick="toggleMenu()">☰</span><b>NEXO PRO MAX ✨</b></div><div class="online">● Online</div></div>
<div class="sub"><span id="subtitle">● GPT-5 • NEXO Pro • Português</span></div>
</div>
<div class="content">
  <div id="v-chat" class="view active"><div class="chat" id="chat"></div><div class="bar"><div class="inputwrap"><input id="inp" placeholder="Pergunte ao NEXO..."><button class="send" onclick="send()">➤</button></div></div></div>
  <div id="v-video" class="view"><div class="center"><h2>🎬 Criar Vídeo</h2><p>Gere vídeos com IA</p><button onclick="goView('chat')">Ir pro Chat e pedir vídeo</button></div></div>
  <div id="v-imagem" class="view"><div class="center"><h2>🖼️ Criar Imagem</h2><p>Gere imagens com IA</p><button onclick="goView('chat')">Ir pro Chat e pedir imagem</button></div></div>
  <div id="v-sobre" class="view"><div class="center"><h2>NEXO PRO MAX</h2><p>APK 1.0 - Feito por você 🔥</p></div></div>
</div>
<script>
const chat=document.getElementById('chat'); const inp=document.getElementById('inp');
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function goView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+name).classList.add('active');
  document.getElementById('subtitle').textContent='● '+name.toUpperCase();
  toggleMenu();
  const url=new URL(window.location); url.searchParams.set('action',name); window.history.pushState({},'',url);
}
function goViewDirect(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('v-'+name).classList.add('active')}
function add(t,who){
  const d=document.createElement('div'); d.className='bubble '+who;
  if(t.includes('__IMAGE__')){const url=t.match(/__IMAGE__(.*?)__/)[1];const prompt=t.replace(/__IMAGE__.*?__/,'').trim();const safe=document.createElement('span');safe.textContent='Gerado: '+prompt;d.appendChild(safe);const img=document.createElement('img');img.src=url;img.loading='lazy';img.onerror=()=>{img.style.display='none'};d.appendChild(img);}else{d.textContent=t;}
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
async function send(){const v=inp.value.trim(); if(!v) return; add(v,'user'); inp.value=''; try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});const j=await r.json(); add(j.reply||'Sem resposta','bot');}catch(e){ add('Erro de conexão','bot'); }}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
add('Oi! Como posso ajudar?','bot');
const params=new URLSearchParams(window.location.search);
if(params.get('action')) goViewDirect(params.get('action'));
</script>
</body></html>
