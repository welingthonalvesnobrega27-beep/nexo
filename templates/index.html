<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXO PRO MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070c10;color:#fff;font-family:Consolas,monospace;height:100vh;display:flex;flex-direction:column}
.top{padding:14px}
.header{background:#121b23;border:1px solid #1f2e3a;border-radius:20px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.header b{letter-spacing:1px}
.online{color:#00ff88;font-size:13px}
.sub{display:flex;justify-content:center;margin-top:10px}
.sub span{border:1px solid #00ff88;padding:6px 18px;border-radius:20px;font-size:12px;color:#aaffcc}
.chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.bubble{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bubble.user{align-self:flex-end;background:#00ff88;color:#000;border-bottom-right-radius:4px;font-weight:600}
.bubble.bot{align-self:flex-start;background:#111a22;border:1px solid #00ff8840;border-left:3px solid #00ff88;border-bottom-left-radius:4px;color:#eafff1}
.bubble.bot img{width:100%;margin-top:10px;border-radius:12px;border:1px solid #00ff88;display:block}
.bar{padding:10px;background:#070c10}
.inputwrap{background:#111a22;border:1px solid #1f3a2a;border-radius:30px;display:flex;align-items:center;padding:6px 8px 6px 16px;gap:8px}
.inputwrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;font-family:Consolas}
.icon{opacity:0.6;font-size:18px}
.send{background:#00ff88;border:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
</style></head><body>
<div class="top">
<div class="header"><b>NEXO PRO MAX ✨</b><div class="online">● Online</div></div>
<div class="sub"><span>● GPT-5 • NEXO Pro • Português</span></div>
</div>
<div class="chat" id="chat"></div>
<div class="bar">
<div class="inputwrap">
<input id="inp" placeholder="Pergunte ao NEXO...">
<span class="icon">🖊️</span><span class="icon">🖼️</span>
<button class="send" onclick="send()">➤</button>
</div>
</div>
<script>
const chat=document.getElementById('chat'); const inp=document.getElementById('inp');
function add(t,who){
  const d=document.createElement('div'); d.className='bubble '+who;
  if(t.includes('__IMAGE__')){
    const url=t.match(/__IMAGE__(.*?)__/)[1];
    const prompt=t.replace(/__IMAGE__.*?__/,'').trim();
    const safe = document.createElement('span'); safe.textContent = 'Gerado: '+prompt;
    d.appendChild(safe);
    const img=document.createElement('img'); img.src=url; img.loading='lazy';
    img.onerror=()=>{img.style.display='none'};
    d.appendChild(img);
  }else{ d.textContent=t; }
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
async function send(){
  const v=inp.value.trim(); if(!v) return;
  add(v,'user'); inp.value='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});
    const j=await r.json(); add(j.reply||'Sem resposta','bot');
  }catch(e){ add('Erro de conexão, tenta de novo','bot'); }
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
add('Oi! Como posso ajudar?','bot');
</script>
</body></html>
