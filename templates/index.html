<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXO PRO MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#000;color:#fff;display:flex;flex-direction:column;height:100vh}
.top{background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.top b{color:#00ff88}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.4}
.user{align-self:flex-end;background:#00ff88;color:#000}
.bot{align-self:flex-start;background:#1a1a1a;border:1px solid #333}
.input-area{display:flex;padding:10px;background:#111;gap:8px;border-top:1px solid #333}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#222;color:#fff;outline:none}
button{padding:12px 18px;border-radius:20px;border:none;background:#00ff88;color:#000;font-weight:bold}
</style>
</head>
<body>
<div class="top"><b>NEXO PRO MAX</b><span>online</span></div>
<div id="chat"><div class="msg bot">Fala Welingthon! NEXO PRO MAX online e pronto. O que vamos criar hoje?</div></div>
<div class="input-area">
<input id="inp" placeholder="Digite aqui..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Enviar</button>
</div>
<script>
async function send(){
  let i=document.getElementById('inp');let t=i.value.trim();if(!t)return;
  let c=document.getElementById('chat');
  c.innerHTML+=`<div class="msg user">${t}</div>`;i.value='';c.scrollTop=c.scrollHeight;
  let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
  let d=await r.json();
  c.innerHTML+=`<div class="msg bot">${d.response||d.error}</div>`;c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
